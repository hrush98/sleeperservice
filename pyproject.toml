[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeperservice"
version = "0.1.0"
description = "Polymarket trading and analysis platform services."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
sleeperservice = "services.cli.main:main"
sleeperservice-coherence = "services.coherence.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "tests",
    "services/coherence",
]
